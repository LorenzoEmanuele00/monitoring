name: MissionControl
options:
  bundleIdPrefix: com.lorenzoemanuele
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

# ADR-0013 ("Two files must stay in sync ... a project.yml edit without a re-generate
# silently does nothing"): `xcodegen generate` overwrites project.pbxproj from this file. The
# same risk runs in reverse too — any setting that only lives hand-added in the committed
# pbxproj, never added here, is silently dropped on the next regeneration (this is exactly
# what happened to design-system-001-styleguide's iteration 1, see that task's `## Verifier
# note (iteration 1)`). Every setting below (each target's REGISTER_APP_GROUPS /
# DEVELOPMENT_TEAM / sandbox entries, DEAD_CODE_STRIPPING, ENABLE_USER_SCRIPT_SANDBOXING,
# STRING_CATALOG_GENERATE_SYMBOLS) exists here specifically so regeneration is lossless — do
# not remove without checking the pbxproj diff.
#
# One exception this file CANNOT cover: PBXProject's `LastUpgradeCheck` attribute (the
# "Xcode version that last upgraded this project" marker). xcodegen computes and writes that
# value unconditionally from the locally installed Xcode/xcodegen toolchain at generation
# time — there is no known project.yml key that overrides it (tested empirically: an
# `attributes: {LastUpgradeCheck: ...}` top-level block round-trips with zero effect on the
# generated pbxproj). It is purely cosmetic (drives Xcode's "recommended settings" banner,
# has no effect on build/provisioning behavior) and will legitimately drift to whatever the
# generating machine's Xcode reports on every future regeneration, on any machine. That is
# expected xcodegen behavior, not a regression to fix here — the committed pbxproj's current
# value is left exactly as the local `xcodegen generate` produces it, not hand-patched.

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Automatic signing, team selected per the environment facts in this task (a real,
    # already-active paid Apple Developer Program membership) — NOT a hardcoded signing
    # identity. Verify with `xcodebuild -showBuildSettings | grep -i team`.
    DEVELOPMENT_TEAM: "2C553PK57P"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES

packages:
  MissionControlKit:
    path: MissionControlKit
  # PostHog Swift SDK (ADR-0010, wired for real in infrastructure-pht7k). Linked ONLY by the
  # MissionControl app target below — never MissionControlWidgets, per ADR-0004/ADR-0010's
  # "extension links nothing heavy" rule. `from: 3.69.8` pins the current release tag at the
  # time this was wired; bump deliberately, not as a side effect of some other change.
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    from: 3.69.8

targets:
  MissionControl:
    type: application
    platform: macOS
    sources:
      - path: MissionControl
        excludes:
          - "MissionControl.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lorenzoemanuele.missioncontrol
        PRODUCT_NAME: MissionControl
        CODE_SIGN_ENTITLEMENTS: MissionControl/MissionControl.entitlements
        ENABLE_APP_SANDBOX: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        GENERATE_INFOPLIST_FILE: YES
        DEAD_CODE_STRIPPING: YES
        # infrastructure-w4dg3: required for the app group entitlement to actually take
        # effect under a real (non-wildcard) provisioning profile — without this the widget
        # shows "No data yet" because the shared app-group container is never registered.
        REGISTER_APP_GROUPS: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
    dependencies:
      - target: MissionControlWidgets
        embed: true
      - package: MissionControlKit
        product: MCDomain
      - package: MissionControlKit
        product: MCDesignTokens
      - package: MissionControlKit
        product: MCSnapshot
      - package: MissionControlKit
        product: MCSecrets
      - package: MissionControlKit
        product: MCPersistence
      - package: MissionControlKit
        product: MCProviders
      - package: PostHog
        product: PostHog
    info:
      path: Generated/MissionControl-Info.plist
      properties:
        CFBundleDisplayName: Mission Control
        LSApplicationCategoryType: public.app-category.developer-tools
    # infrastructure-pht7k / ADR amending ADR-0010's storage clause: the PostHog Project API
    # Key + ingestion host live in a gitignored `MissionControl/.env`, never in this committed
    # file or in `Generated/MissionControl-Info.plist`. This script sources `.env` at build
    # time and writes the two values into the *built* Info.plist only, after
    # GENERATE_INFOPLIST_FILE has produced it and it's been copied into the app bundle
    # (postBuildScripts), so PlistBuddy always finds a real file to edit and Xcode's automatic
    # codesign step (which always runs last, after every build phase) signs the final content.
    # If `.env` is absent or incomplete (CI, or before the builder has populated it), the
    # script logs a warning and exits 0 rather than failing the build —
    # `AnalyticsEventLoggerFactory` (MissionControl/PostHogAnalyticsEventLogger.swift) reads
    # these same two keys back via `Bundle.main.object(forInfoDictionaryKey:)` and falls back
    # to a no-op analytics logger when either is missing.
    postBuildScripts:
      - name: Inject PostHog config from .env
        shell: /bin/bash
        showEnvVars: false
        basedOnDependencyAnalysis: false
        script: |
          set -e
          ENV_FILE="${SRCROOT}/.env"
          PLIST="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"

          if [ ! -f "$ENV_FILE" ]; then
            echo "warning: MissionControl/.env not found — PostHog structured events will fall back to a no-op logger (see infrastructure BC README)"
            exit 0
          fi

          set -a
          # shellcheck disable=SC1090
          source "$ENV_FILE"
          set +a

          if [ -z "${POSTHOG_API_KEY:-}" ] || [ -z "${POSTHOG_HOST:-}" ]; then
            echo "warning: MissionControl/.env is missing POSTHOG_API_KEY and/or POSTHOG_HOST — PostHog structured events will fall back to a no-op logger"
            exit 0
          fi

          /usr/libexec/PlistBuddy -c "Add :PostHogAPIKey string ${POSTHOG_API_KEY}" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :PostHogAPIKey ${POSTHOG_API_KEY}" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :PostHogHost string ${POSTHOG_HOST}" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :PostHogHost ${POSTHOG_HOST}" "$PLIST"

  MissionControlWidgets:
    type: app-extension
    platform: macOS
    sources:
      - path: MissionControlWidgets
        excludes:
          - "MissionControlWidgets.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lorenzoemanuele.missioncontrol.widgets
        PRODUCT_NAME: MissionControlWidgets
        CODE_SIGN_ENTITLEMENTS: MissionControlWidgets/MissionControlWidgets.entitlements
        ENABLE_APP_SANDBOX: YES
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
        DEAD_CODE_STRIPPING: YES
        DEVELOPMENT_TEAM: "2C553PK57P"
        # infrastructure-w4dg3: same app-group registration fix as the app target — the
        # widget extension is the side that actually reads the shared container.
        REGISTER_APP_GROUPS: YES
        # Widget extension App Sandbox capability entries, mirrored from what Xcode's
        # Signing & Capabilities UI writes when "Outgoing/Incoming Connections" and the
        # resource-access toggles are all left off for this target.
        ENABLE_INCOMING_NETWORK_CONNECTIONS: NO
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: NO
        ENABLE_RESOURCE_ACCESS_AUDIO_INPUT: NO
        ENABLE_RESOURCE_ACCESS_BLUETOOTH: NO
        ENABLE_RESOURCE_ACCESS_CALENDARS: NO
        ENABLE_RESOURCE_ACCESS_CAMERA: NO
        ENABLE_RESOURCE_ACCESS_CONTACTS: NO
        ENABLE_RESOURCE_ACCESS_LOCATION: NO
        ENABLE_RESOURCE_ACCESS_PRINTING: NO
        ENABLE_RESOURCE_ACCESS_USB: NO
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../../../../Frameworks"
    dependencies:
      # ADR-0004: the widget extension links ONLY MCSnapshot + MCDesignTokens — no network,
      # no DB, no credentials, no remote images. Structurally enforced here, not just by
      # convention: MCPersistence/MCSecrets/MCProviders are simply not listed.
      - package: MissionControlKit
        product: MCSnapshot
      - package: MissionControlKit
        product: MCDesignTokens
    info:
      path: Generated/MissionControlWidgets-Info.plist
      properties:
        CFBundleDisplayName: Mission Control Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
